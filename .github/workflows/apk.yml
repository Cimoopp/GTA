name: Сборка APK

# Сборка запускается сама при любом изменении в main,
# либо вручную кнопкой Run workflow на вкладке Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Новая сборка отменяет предыдущую — не тратим время на устаревшие.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BT_VERSION: 34.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код игры
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------
      #  Android SDK ставим БЕЗ sdkmanager (он падал с exit code 1).
      #  Качаем архивы Google, но имя файла не угадываем: берём его
      #  из официального списка Google и проверяем, что это реально zip.
      # ---------------------------------------------------------------
      - name: Android build-tools (apksigner и zipalign)
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/build-tools" "$SDK/platforms" "$SDK/platform-tools"

          # Официальный список пакетов Android SDK
          XML=/tmp/repository.xml
          curl -fsSL -o "$XML" https://dl.google.com/android/repository/repository2-3.xml || true

          # Точное имя архива build-tools 34 из списка Google
          BT_NAME="$(grep -oE 'build-tools_r34[^"<]*linux\.zip' "$XML" 2>/dev/null | head -1 || true)"
          if [ -z "$BT_NAME" ]; then
            BT_NAME="build-tools_r34-linux.zip"
          fi
          echo "Архив build-tools: $BT_NAME"

          curl -fL -o /tmp/bt.zip "https://dl.google.com/android/repository/$BT_NAME"
          unzip -tq /tmp/bt.zip            # если это не zip — упадём с понятной ошибкой

          rm -rf /tmp/bt && mkdir -p /tmp/bt
          unzip -q /tmp/bt.zip -d /tmp/bt
          # Внутри архива папка android-14, файлы apksigner/zipalign — в её корне
          SRC="$(find /tmp/bt -maxdepth 1 -mindepth 1 -type d | head -1)"
          cp -a "$SRC/." "$SDK/build-tools/$BT_VERSION/"
          chmod +x "$SDK/build-tools/$BT_VERSION"/* 2>/dev/null || true

          echo "--- содержимое build-tools/$BT_VERSION ---"
          ls -1 "$SDK/build-tools/$BT_VERSION" | head -30
          # Жёсткая проверка: без apksigner APK не подписать
          test -x "$SDK/build-tools/$BT_VERSION/apksigner"
          test -x "$SDK/build-tools/$BT_VERSION/zipalign"
          echo "OK: build-tools на месте"

      - name: Android platform (android-34)
        run: |
          set -uo pipefail
          SDK="$HOME/android-sdk"
          XML=/tmp/repository.xml

          CAND=""
          if [ -f "$XML" ]; then
            CAND="$(grep -oE 'platform-34[^"<]*\.zip' "$XML" | sort -u | head -5 || true)"
          fi
          # Плюс известные варианты на случай, если список не прочитался
          CAND="$CAND platform-34_r02.zip platform-34-ext7_r02.zip platform-34-ext7_r03.zip platform-34-ext7_r05.zip"

          OK=0
          for n in $CAND; do
            echo "Пробуем $n"
            if curl -fsSL -o /tmp/pf.zip "https://dl.google.com/android/repository/$n" \
               && unzip -tq /tmp/pf.zip >/dev/null 2>&1; then
              rm -rf /tmp/pf && mkdir -p /tmp/pf
              unzip -q /tmp/pf.zip -d /tmp/pf
              SRC="$(find /tmp/pf -maxdepth 1 -mindepth 1 -type d | head -1)"
              mkdir -p "$SDK/platforms/android-34"
              cp -a "$SRC/." "$SDK/platforms/android-34/"
              echo "OK: платформа установлена из $n"
              OK=1
              break
            fi
          done
          if [ "$OK" = "0" ]; then
            echo "ВНИМАНИЕ: платформу android-34 не удалось скачать (сборке она может и не понадобиться)"
          fi
          ls -1 "$SDK/platforms" || true

      - name: Android platform-tools
        run: |
          set -uo pipefail
          SDK="$HOME/android-sdk"
          if curl -fsSL -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
             && unzip -tq /tmp/pt.zip >/dev/null 2>&1; then
            rm -rf /tmp/pt && mkdir -p /tmp/pt
            unzip -q /tmp/pt.zip -d /tmp/pt
            cp -a /tmp/pt/platform-tools/. "$SDK/platform-tools/"
            echo "OK: platform-tools установлены"
          else
            echo "ВНИМАНИЕ: platform-tools не скачались (для сборки APK они не критичны)"
          fi

      # ---------------------------------------------------------------
      #  Движок Godot 4.3 и шаблоны экспорта
      # ---------------------------------------------------------------
      - name: Скачать Godot 4.3
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -tq /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          cp /tmp/godot/Godot_v4.3-stable_linux.x86_64 ./godot
          chmod +x ./godot
          ./godot --version

      - name: Скачать шаблоны экспорта
        run: |
          set -euo pipefail
          curl -fL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -tq /tmp/templates.tpz
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"
          cp -a /tmp/tpl/templates/. "$DEST/"
          echo "--- шаблоны Android ---"
          ls -1 "$DEST" | grep -i android
          test -f "$DEST/android_debug.apk"

      - name: Ключ подписи APK
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l "$HOME/debug.keystore"

      - name: Настройки Godot (пути к SDK и ключу)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > /tmp/editor_settings.tres <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$HOME/android-sdk"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          # Godot ищет файл под разными именами в зависимости от версии — кладём оба
          cp /tmp/editor_settings.tres "$HOME/.config/godot/editor_settings-4.tres"
          cp /tmp/editor_settings.tres "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Импорт проекта
        run: |
          set -uo pipefail
          ./godot --headless --path . --import || true

      - name: Сборка APK
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/mini-gta.apk
          ls -la build
          test -s build/mini-gta.apk
          echo "РАЗМЕР APK: $(stat -c%s build/mini-gta.apk) байт"
          head -c 2 build/mini-gta.apk | xxd | head -1

      - name: Выложить APK в Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini GTA — сборка ${{ github.run_number }}
          body: "Автосборка APK из ветки main (коммит ${{ github.sha }})."
          files: build/mini-gta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранить APK как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-gta-apk
          path: build/mini-gta.apk
          if-no-files-found: warn

      - name: Диагностика при ошибке
        if: failure()
        run: |
          echo "=== android-sdk ==="
          find "$HOME/android-sdk" -maxdepth 3 | head -60
          echo "=== настройки Godot ==="
          cat "$HOME/.config/godot/editor_settings-4.3.tres" || true
          echo "=== файлы проекта ==="
          ls -la
