# Автосборка APK игры Mini GTA прямо в облаке GitHub.
#
# Что делает: ставит Java 17, разворачивает Android SDK, качает Godot 4.3
# с шаблонами экспорта, собирает APK и выкладывает mini-gta.apk в Releases.
#
# Запуск: вкладка Actions -> "Сборка APK" -> Run workflow.
# Либо просто изменить любой файл игры — сборка стартует сама.
#
# ВАЖНО про изменения: раньше здесь использовалось действие
# android-actions/setup-android@v3, но его sdkmanager падал с exit code 1
# (и сборка обрывалась на первом же шаге). Теперь Android SDK
# разворачивается готовыми архивами от Google — без sdkmanager.

name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Если запустилось несколько сборок подряд — остаётся только последняя
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Собрать mini-gta.apk
    runs-on: ubuntu-latest
    env:
      GODOT_VER: 4.3-stable
      TPL_VER: 4.3.stable

    steps:
      - name: Скачать код игры
        uses: actions/checkout@v4

      # Java нужна для подписи APK (keytool и apksigner внутри build-tools)
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK раскладываем вручную из официальных архивов Google.
      # Так надёжнее: не зависим от sdkmanager и от того, что уже стоит на раннере.
      - name: Android SDK (архивы Google)
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/build-tools" "$SDK/platforms" "$SDK/licenses"

          echo "== build-tools 34.0.0 (в них apksigner и zipalign) =="
          curl -sSLo /tmp/bt.zip "https://dl.google.com/android/repository/build-tools_r34-linux.zip"
          unzip -q /tmp/bt.zip -d /tmp/bt
          BT=$(ls -d /tmp/bt/android-* | head -1)
          mv "$BT" "$SDK/build-tools/34.0.0"
          chmod +x "$SDK/build-tools/34.0.0/bin/"* || true

          echo "== платформа android-34 =="
          curl -sSLo /tmp/pf.zip "https://dl.google.com/android/repository/platform-34_r03.zip"
          unzip -q /tmp/pf.zip -d /tmp/pf
          PF=$(ls -d /tmp/pf/android-* | head -1)
          mv "$PF" "$SDK/platforms/android-34"

          echo "== platform-tools =="
          curl -sSLo /tmp/pt.zip "https://dl.google.com/android/repository/platform-tools-latest-linux.zip"
          unzip -q /tmp/pt.zip -d /tmp/pt
          mv /tmp/pt/platform-tools "$SDK/platform-tools"

          # Принятые лицензии — чтобы инструменты не требовали подтверждения
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"

          echo "== что получилось =="
          ls "$SDK"
          ls "$SDK/build-tools/34.0.0" | head -5
          ls "$SDK/platforms/android-34" | head -5

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Скачать Godot 4.3
        run: |
          set -e
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VER}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Скачать шаблоны экспорта
        run: |
          set -e
          curl -sSLo templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}"
          cp -r tpl/templates/. "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
          echo "== шаблоны на месте =="
          cat "$HOME/.local/share/godot/export_templates/${TPL_VER}/version.txt"

      # Отладочный ключ, которым подписывается APK
      - name: Ключ подписи APK
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12
          ls -l debug.keystore

      # Godot берёт путь к Android SDK, JDK и ключу подписи из своих настроек.
      # Пишем файл настроек сразу в двух именах — разные версии Godot ищут разное имя.
      - name: Настройки Godot (пути к SDK, JDK и ключу)
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          CFG="$HOME/.config/godot/editor_settings-4.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$CFG"
          cp "$CFG" "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "== настройки Godot =="
          cat "$CFG"

      # Дублируем ключ подписи прямо в профиль экспорта — так сборка не зависит
      # от того, прочитал ли Godot настройки. Заодно делаем версию сборки
      # уникальной, чтобы новую сборку можно было ставить поверх старой.
      - name: Прописать ключ подписи и версию в профиль экспорта
        run: |
          set -e
          python3 - <<'PY'
          import os
          path = "export_presets.cfg"
          text = open(path, encoding="utf-8").read()
          ws = os.environ["GITHUB_WORKSPACE"]
          run = os.environ["GITHUB_RUN_NUMBER"]
          text = text.replace('keystore/debug=""', 'keystore/debug="%s/debug.keystore"' % ws)
          text = text.replace('keystore/debug_user=""', 'keystore/debug_user="androiddebugkey"')
          text = text.replace('keystore/debug_password=""', 'keystore/debug_password="android"')
          text = text.replace('version/code=1', 'version/code=%s' % run)
          open(path, "w", encoding="utf-8").write(text)
          print("Профиль экспорта подготовлен, версия сборки:", run)
          PY
          grep -n "keystore/debug\|version/code" export_presets.cfg || true

      - name: Импорт проекта
        run: ./godot --headless --path . --import || true

      # Основной шаг: сборка APK
      - name: Сборка APK
        run: |
          set +e
          ./godot --headless --path . --export-debug "Android" "$PWD/mini-gta.apk" > /tmp/export.log 2>&1
          cat /tmp/export.log
          if [ ! -f "$PWD/mini-gta.apk" ]; then
            MSG=$(tail -c 700 /tmp/export.log | tr '\n' ' ')
            echo "::error title=Сборка APK не удалась::$MSG"
            exit 1
          fi
          ls -lh mini-gta.apk

      # Готовый APK появляется в разделе Releases — оттуда его удобно скачать
      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Mini GTA — сборка ${{ github.run_number }}"
          body: |
            Готовый APK игры Mini GTA.

            Как установить: скачай файл mini-gta.apk на телефон, открой его
            и разреши установку из неизвестных источников.
          files: mini-gta.apk

      # Запасной вариант: APK сохраняется ещё и как артефакт сборки
      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-gta-apk
          path: mini-gta.apk

      # Если что-то упало — показываем причину прямо в логе сборки
      - name: Что случилось (диагностика)
        if: failure()
        run: |
          echo "=== Хвост лога сборки ==="
          tail -40 /tmp/export.log 2>/dev/null || echo "лога сборки нет"
          echo "=== Шаблоны экспорта ==="
          ls "$HOME/.local/share/godot/export_templates/${TPL_VER}" | head -20 || true
          echo "=== Android SDK ==="
          ls "$ANDROID_SDK_ROOT" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          ls "$ANDROID_SDK_ROOT/platforms" || true
          echo "=== Профиль экспорта ==="
          grep -n "keystore\|icon" export_presets.cfg || true
