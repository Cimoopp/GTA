# Автосборка APK игры Mini GTA прямо в облаке GitHub.
#
# Что делает: ставит Java 17 и Android SDK в облачную машину, качает Godot 4.3
# с шаблонами экспорта, собирает APK и выкладывает файл mini-gta.apk в Releases.
#
# Запуск: вкладка Actions -> "Сборка APK" -> Run workflow.
# Либо просто изменить любой файл игры — сборка стартует сама.

name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Если запустилось несколько сборок подряд — остаётся только последняя
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Собрать mini-gta.apk
    runs-on: ubuntu-latest
    env:
      GODOT_VER: 4.3-stable
      TPL_VER: 4.3.stable

    steps:
      - name: Скачать код игры
        uses: actions/checkout@v4

      # Java нужна для подписи APK (keytool и apksigner)
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ставим командные инструменты Android (в них входит sdkmanager)
      - name: Инструменты Android
        uses: android-actions/setup-android@v3

      # Ставим сам Android SDK в свою папку — так не будет проблем с правами.
      # Сначала пробуем sdkmanager, если он не справился — берём архивы Google.
      - name: Android SDK (build-tools нужны для подписи APK)
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | sdkmanager --sdk_root="$SDK" --licenses > /tmp/lic.log 2>&1 || true
          sdkmanager --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdk.log 2>&1 || true

          if [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "sdkmanager не справился — качаем build-tools архивом от Google"
            curl -sSLo /tmp/bt.zip "https://dl.google.com/android/repository/build-tools_r34-linux.zip"
            unzip -q /tmp/bt.zip -d /tmp/bt
            mkdir -p "$SDK/build-tools"
            mv /tmp/bt/android-* "$SDK/build-tools/34.0.0"
          fi
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "Качаем платформу android-34 архивом от Google"
            curl -sSLo /tmp/pf.zip "https://dl.google.com/android/repository/platform-34_r03.zip"
            unzip -q /tmp/pf.zip -d /tmp/pf
            mkdir -p "$SDK/platforms"
            mv /tmp/pf/android-* "$SDK/platforms/android-34"
          fi
          chmod +x "$SDK/build-tools/34.0.0/"* 2>/dev/null || true

          # Лицензии SDK — чтобы инструменты не требовали подтверждения
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"

          echo "=== Ошибки sdkmanager (если были) ==="
          tail -5 /tmp/sdk.log || true
          echo "=== Что стоит в SDK ==="
          ls "$SDK" || true
          ls "$SDK/build-tools" || true
          ls "$SDK/platforms" || true

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Скачать Godot 4.3
        run: |
          set -e
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VER}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Скачать шаблоны экспорта
        run: |
          set -e
          curl -sSLo templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/${TPL_VER}"
          cp -r tpl/templates/. "$HOME/.local/share/godot/export_templates/${TPL_VER}/"
          echo "=== Шаблоны на месте ==="
          ls "$HOME/.local/share/godot/export_templates/${TPL_VER}" | head -20
          cat "$HOME/.local/share/godot/export_templates/${TPL_VER}/version.txt"

      # Отладочный ключ, которым подписывается APK
      - name: Ключ подписи APK
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12
          ls -l debug.keystore

      # Godot берёт пути к SDK, Java и ключу из своих настроек редактора.
      # Поэтому сначала даём движку создать файл настроек, потом дописываем пути.
      - name: Настройки Godot (пути к SDK и ключу)
        run: |
          set -e
          timeout 150 ./godot --headless --editor --quit-after 3 > /tmp/godot_editor.log 2>&1 || true

          SET=$(ls "$HOME/.config/godot/editor_settings-"*.tres 2>/dev/null | head -1 || true)
          if [ -z "$SET" ]; then
            SET="$HOME/.config/godot/editor_settings-4.3.tres"
            mkdir -p "$HOME/.config/godot"
          fi

          python3 - "$SET" <<'PY'
          import os, sys
          path = sys.argv[1]
          text = open(path).read() if os.path.exists(path) else ""
          if "[gd_resource" not in text:
              text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' + text
          elif "[resource]" not in text:
              text += "\n[resource]\n"
          keys = {
              "export/android/android_sdk_path": os.environ.get("ANDROID_SDK_ROOT", ""),
              "export/android/java_sdk_path": os.environ.get("JAVA_HOME", ""),
              "export/android/debug_keystore": os.path.join(os.environ.get("GITHUB_WORKSPACE", ""), "debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          for k, v in keys.items():
              text += '%s = "%s"\n' % (k, v)
          open(path, "w").write(text)
          print("Настройки записаны в", path)
          PY

          cp "$SET" "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Импорт проекта
        run: ./godot --headless --path . --import || true

      # Основной шаг: сборка APK
      - name: Сборка APK
        run: |
          set +e
          ./godot --headless --verbose --path . --export-debug "Android" "$PWD/mini-gta.apk" > /tmp/export.log 2>&1
          cat /tmp/export.log
          if [ ! -f "$PWD/mini-gta.apk" ]; then
            MSG=$(tail -c 700 /tmp/export.log | tr '\n' ' ')
            echo "::error title=Сборка APK не удалась::$MSG"
            exit 1
          fi
          ls -lh mini-gta.apk

      # Готовый APK появляется в разделе Releases — оттуда его удобно скачать
      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Mini GTA — сборка ${{ github.run_number }}"
          body: |
            Готовый APK игры Mini GTA.

            Как установить: скачай файл mini-gta.apk на телефон, открой его
            и разреши установку из неизвестных источников.
          files: mini-gta.apk

      # Запасной вариант: APK сохраняется ещё и как артефакт сборки
      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-gta-apk
          path: mini-gta.apk

      # Если что-то упало — показываем причину прямо в логе сборки
      - name: Что случилось (диагностика)
        if: failure()
        run: |
          echo "=== Хвост лога сборки ==="
          tail -40 /tmp/export.log 2>/dev/null || echo "лога сборки нет"
          echo "=== Шаблоны экспорта ==="
          ls "$HOME/.local/share/godot/export_templates/" || true
          ls "$HOME/.local/share/godot/export_templates/${TPL_VER}" | head -20 || true
          echo "=== Android SDK ==="
          ls "$ANDROID_SDK_ROOT" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true
          ls "$ANDROID_SDK_ROOT/platforms" || true
