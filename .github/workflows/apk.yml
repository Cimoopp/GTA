# Автосборка APK игры Mini GTA прямо в облаке GitHub.
#
# Что делает: ставит Java + Android SDK, скачивает Godot 4.3, собирает APK
# и выкладывает готовый файл mini-gta.apk в раздел Releases.
#
# Как запустить: вкладка Actions -> "Сборка APK" -> Run workflow.
# Или просто изменить любой файл игры — сборка стартует сама.

name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    name: Собрать mini-gta.apk
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код игры
        uses: actions/checkout@v4

      # Java нужна сборщику Gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK: платформа 34 и сборочные инструменты
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # NDK требуется сборочному скрипту Godot; если не поставится — Gradle скачает сам
      - name: NDK
        run: sdkmanager "ndk;23.2.8568313" || echo "NDK не установился, Gradle скачает его сам"

      - name: Godot 4.3 и шаблоны экспорта
        run: |
          set -e
          VER=4.3-stable
          wget -q "https://github.com/godotengine/godot/releases/download/$VER/Godot_v${VER}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${VER}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

          wget -q "https://github.com/godotengine/godot/releases/download/$VER/Godot_v${VER}_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -r tpl/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "Шаблоны:"; cat "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"

      # Ключ отладочной подписи и пути к SDK/Java для Godot
      - name: Ключ подписи и настройки Godot
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12

          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$PWD/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Импорт проекта
        run: ./godot --headless --path . --import || true

      - name: Сборка APK
        run: ./godot --headless --path . --export-debug "Android" mini-gta.apk

      - name: Проверить, что файл создан
        run: ls -lh mini-gta.apk

      # Готовый APK появляется в разделе Releases — оттуда его удобно скачать на телефон
      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Mini GTA — сборка ${{ github.run_number }}"
          body: |
            Готовый APK игры Mini GTA.

            Как установить: скачай файл mini-gta.apk на телефон, открой его
            и разреши установку из неизвестных источников.
          files: mini-gta.apk

      # Запасной вариант: APK сохраняется ещё и как артефакт сборки
      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-gta-apk
          path: mini-gta.apk
