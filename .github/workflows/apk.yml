# Автосборка APK игры Mini GTA прямо в облаке GitHub.
#
# Что делает: ставит Java и Android SDK, скачивает Godot 4.3 и шаблоны экспорта,
# собирает APK и выкладывает готовый файл mini-gta.apk в раздел Releases.
#
# Как запустить: вкладка Actions -> "Сборка APK" -> Run workflow.
# Или просто изменить любой файл игры — сборка стартует сама.

name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Если запустилось несколько сборок подряд — оставляем только последнюю
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Собрать mini-gta.apk
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код игры
        uses: actions/checkout@v4

      # Java нужна для подписи APK (keytool и apksigner)
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Ставим сами командные инструменты Android. Пакеты добавляем отдельным
      # шагом через sdkmanager — так надёжнее, чем списком в параметрах.
      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Пакеты Android (build-tools нужны для подписи APK)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK: $ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Скачать Godot 4.3
        run: |
          set -e
          VER=4.3-stable
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v${VER}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${VER}_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Скачать шаблоны экспорта
        run: |
          set -e
          VER=4.3-stable
          curl -sSLo templates.tpz "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v${VER}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -r tpl/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          cat "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"

      # Отладочный ключ, которым подписывается APK
      - name: Ключ подписи APK
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12
          ls -l debug.keystore

      # Godot берёт пути к SDK, Java и ключу из своих настроек редактора.
      # Пишем файл сразу под два имени, чтобы версия Godot точно его увидела.
      - name: Настройки Godot (пути к SDK и ключу)
        run: |
          set -e
          SET="$HOME/.config/godot"
          mkdir -p "$SET"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$PWD/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$SET/editor_settings-4.3.tres"
          cp "$SET/editor_settings-4.3.tres" "$SET/editor_settings-4.tres"
          cat "$SET/editor_settings-4.3.tres"

      - name: Импорт проекта
        run: ./godot --headless --path . --import || true

      - name: Сборка APK
        run: |
          ./godot --headless --path . --export-debug "Android" "$PWD/mini-gta.apk"
          ls -lh mini-gta.apk

      # Готовый APK появляется в разделе Releases — оттуда его удобно скачать
      - name: Выложить APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Mini GTA — сборка ${{ github.run_number }}"
          body: |
            Готовый APK игры Mini GTA.

            Как установить: скачай файл mini-gta.apk на телефон, открой его
            и разреши установку из неизвестных источников.
          files: mini-gta.apk

      # Запасной вариант: APK сохраняется ещё и как артефакт сборки
      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: mini-gta-apk
          path: mini-gta.apk
