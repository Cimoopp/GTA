name: Сборка APK

# Сборка запускается сама при изменении в main либо вручную кнопкой Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код игры
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------
      #  Раньше мы качали Android SDK архивами Google — именно там всё и
      #  падало (sdkmanager с exit code 1, битые zip, неверные имена).
      #  В образе ubuntu-latest Android SDK УЖЕ установлен вместе с
      #  build-tools, platform-tools и принятыми лицензиями.
      #  Берём его. Скачивание оставлено только как аварийный запасной путь.
      # ---------------------------------------------------------------
      - name: Android SDK (берём готовый из образа GitHub)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${ANDROID_HOME:-нет}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-нет}"
          echo "Использую SDK: $SDK"

          echo "=== каталоги SDK ==="
          ls -1 "$SDK" || true
          echo "=== build-tools ==="
          ls -1 "$SDK/build-tools" || true
          echo "=== platforms ==="
          ls -1 "$SDK/platforms" || true

          if [ ! -d "$SDK/build-tools" ] || [ -z "$(ls -1A "$SDK/build-tools" 2>/dev/null)" ]; then
            echo "В образе нет build-tools — скачиваю архив Google (запасной путь)"
            mkdir -p "$SDK/build-tools/34.0.0"
            for n in build-tools_r34-linux.zip build-tools_r34.0.0-linux.zip; do
              echo "Пробую $n"
              if curl -fsSL -o /tmp/bt.zip "https://dl.google.com/android/repository/$n" \
                 && unzip -tq /tmp/bt.zip >/dev/null 2>&1; then
                rm -rf /tmp/bt && mkdir -p /tmp/bt
                unzip -q /tmp/bt.zip -d /tmp/bt
                SRC="$(find /tmp/bt -maxdepth 1 -mindepth 1 -type d | head -1)"
                cp -a "$SRC/." "$SDK/build-tools/34.0.0/"
                echo "OK: build-tools из $n"
                break
              fi
            done
            chmod +x "$SDK/build-tools/34.0.0"/* 2>/dev/null || true
          fi

          echo "=== итог по build-tools ==="
          ls -1 "$SDK/build-tools" || true
          test -d "$SDK/build-tools" || { echo "ОШИБКА: build-tools отсутствуют"; exit 1; }
          ls -1 "$SDK/platform-tools" >/dev/null 2>&1 || echo "ВНИМАНИЕ: нет platform-tools"

          # Передаём путь дальше по шагам
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      #  Движок Godot 4.3 и шаблоны экспорта
      # ---------------------------------------------------------------
      - name: Скачать Godot 4.3
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -tq /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          cp /tmp/godot/Godot_v4.3-stable_linux.x86_64 ./godot
          chmod +x ./godot
          ./godot --version

      - name: Скачать шаблоны экспорта
        run: |
          set -euo pipefail
          curl -fL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -tq /tmp/templates.tpz
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"
          cp -a /tmp/tpl/templates/. "$DEST/"
          echo "--- шаблоны Android ---"
          ls -1 "$DEST" | grep -i android
          test -f "$DEST/android_debug.apk"

      - name: Ключ подписи APK
        run: |
          set -euo pipefail
          rm -f "$HOME/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l "$HOME/debug.keystore"

      - name: Настройки Godot (путь к SDK и ключ)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > /tmp/editor_settings.tres <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "${ANDROID_SDK}"
export/android/java_sdk_path = "${JAVA_HOME}"
export/android/debug_keystore = "${HOME}/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          cp /tmp/editor_settings.tres "$HOME/.config/godot/editor_settings-4.tres"
          cp /tmp/editor_settings.tres "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

          # Подстраховка: прописываем тот же ключ и в самом профиле экспорта
          sed -i "s|^keystore/debug=.*|keystore/debug=\"${HOME}/debug.keystore\"|" export_presets.cfg
          sed -i "s|^keystore/debug_user=.*|keystore/debug_user=\"androiddebugkey\"|" export_presets.cfg
          sed -i "s|^keystore/debug_password=.*|keystore/debug_password=\"android\"|" export_presets.cfg
          # Номер версии в APK = номер сборки
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          grep -n "^keystore/" export_presets.cfg

      - name: Импорт проекта
        run: |
          set -uo pipefail
          ./godot --headless --path . --import || true

      - name: Сборка APK
        run: |
          set -euo pipefail
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/mini-gta.apk
          ls -la build
          test -s build/mini-gta.apk
          echo "РАЗМЕР APK: $(stat -c%s build/mini-gta.apk) байт"

      - name: Выложить APK в Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini GTA — сборка ${{ github.run_number }}
          body: "Автосборка APK из ветки main (коммит ${{ github.sha }})."
          files: build/mini-gta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранить APK как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-gta-apk
          path: build/mini-gta.apk
          if-no-files-found: warn

      - name: Диагностика при ошибке
        if: failure()
        run: |
          echo "=== android sdk ==="
          SDK="${ANDROID_SDK:-/usr/local/lib/android/sdk}"
          ls -1 "$SDK" || true
          ls -1 "$SDK/build-tools" || true
          echo "=== настройки Godot ==="
          cat "$HOME/.config/godot/editor_settings-4.3.tres" || true
          echo "=== файлы проекта ==="
          ls -la
          ls -la build 2>/dev/null || true
